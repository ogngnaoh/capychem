[project]
name = "capychem-core"
version = "0.0.0"
description = "CapyChem core: oracle bridge, loop, mutations, analyzer adapters."
requires-python = ">=3.12"
dependencies = [
    "rdkit==2026.3.*",
    "langgraph>=0.2",
    "langfuse>=2,<3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "python-dotenv>=1.0",
]

[project.scripts]
capychem-run = "capychem.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `capychem` is a PEP 420 namespace package shared with capychem-api (apps/api).
# No capychem/__init__.py anywhere — that is what lets the two distributions merge.
[tool.hatch.build.targets.wheel]
packages = ["capychem"]
