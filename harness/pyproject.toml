[project]
name = "capychem-harness"
version = "0.0.0"
description = "Isolated legacy PMO/PyTDC harness (Python 3.10). Reached only via subprocess + JSON — never imported by modern code."
requires-python = ">=3.10,<3.11"
dependencies = [
    "pytdc==0.3.6",
    # PyTDC 0.3.6 imports these at runtime but does not declare them.
    "rdkit",
    "requests",
    "networkx",
    "scipy",
    "numpy<2",              # scikit-learn 1.2.2 + the legacy jnk3 RF pickle need numpy 1.x
    "scikit-learn==1.2.2",  # newest sklearn keeping the 7-field tree-node dtype the jnk3/gsk3b/drd2 pickles need
]

# This project is deliberately NOT a member of the root uv workspace. Its pinned
# legacy deps (PyTDC 0.3.6, Python 3.10) must never resolve against the modern
# 3.12 lockfile. It manages its own .venv via `uv sync` run from this directory.
[tool.uv]
package = false
