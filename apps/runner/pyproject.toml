[project]
name = "capychem-runner"
version = "0.0.0"
description = "CapyChem out-of-process worker: claims the durable Postgres queue and drives the LangGraph loop (milestone 08 slice 02). A separate OS process from apps/api's FastAPI server and from the Modal apps/worker."
requires-python = ">=3.12"
dependencies = [
    "capychem-core",
    # Reuses RunRegistry (claim_and_drive_once / run_worker_loop / _drive) from
    # apps/api rather than duplicating the ~250-line loop-driving state machine.
    # capychem.api.runner itself imports no FastAPI/uvicorn/Modal symbols; this
    # package never starts a web server.
    "capychem-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capychem_runner"]

[tool.uv.sources]
capychem-core = { workspace = true }
capychem-api = { workspace = true }
