[project]
name = "capychem-workspace"
version = "0.0.0"
description = "CapyChem monorepo root — uv workspace coordinator (no package code of its own)."
requires-python = ">=3.12"
dependencies = [
    "capychem-core",
    "capychem-api",
    "capychem-runner",
]

[tool.uv]
package = false

# harness/ is deliberately NOT a member. It pins Python 3.10 + legacy PyTDC and is
# reached only via subprocess (see packages/core/capychem/oracle.py). Never import it.
[tool.uv.workspace]
members = ["packages/core", "apps/api", "apps/runner"]

[tool.uv.sources]
capychem-core = { workspace = true }
capychem-api = { workspace = true }
capychem-runner = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "ruff>=0.8",
    "httpx-ws>=0.6",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/core/tests", "apps/api/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["harness"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
# `capychem` is a PEP 420 namespace split across packages/core and apps/api.
# These let mypy map files to the right dotted module from the source roots.
namespace_packages = true
explicit_package_bases = true
mypy_path = "packages/core:apps/api"
exclude = ["harness/"]

# rdkit ships rdkit-stubs, but its 2026.3 .pyi files contain a stub-level syntax
# error (rdchem.pyi: a parameter without a default follows one with a default) that
# halts mypy the moment rdkit is imported. Skip following imports into rdkit — and
# its stubs — so the broken .pyi is never parsed; rdkit symbols become Any. RDKit
# correctness is covered at runtime and by the integration tests, not by these stubs.
[[tool.mypy.overrides]]
module = "rdkit.*"
follow_imports = "skip"
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
module = ["modal", "modal.*"]
ignore_missing_imports = true
